services:
  cassandra:
    image: cassandra:4.1
    container_name: soundhub-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: soundhub
      # Limite la mémoire pour un laptop
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    
  redis:
      image: redis:7
      container_name: soundhub-redis
      ports:
        - "6379:6379"
      command: ["redis-server", "--appendonly", "yes"]
      volumes:
        - redis-data:/data
      restart: unless-stopped


volumes:
  cassandra_data:
  redis-data:
